version: '3.8'

services:
  mysql:
    image: mysql:8.0
    container_name: mysql-db-restaurant-project
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: thuan12345
      MYSQL_DATABASE: myapp_db
      MYSQL_USER: app_user
      MYSQL_PASSWORD: app_pass
    ports:
      - "3307:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    command: --default-authentication-plugin=mysql_native_password

volumes:
  mysql_data: